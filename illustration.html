<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ILLUSTRATION</title>

    <meta name="description" content="イラスト作品を掲載しています。" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ==================== -->
    <!-- HEADER -->
    <!-- ==================== -->

    <header class="header">
      <div class="logo">
        <a href="index.html"> Usagi no OneKeri </a>
      </div>

      <nav>
        <ul>
          <li>
            <a href="index.html">TOP</a>
          </li>

          <li>
            <a href="illustration.html">ILLUSTRATION</a>
          </li>

          <li>
            <a href="goods.html">GOODS</a>
          </li>

          <li class="contact-button">
            <a href="contact.html">CONTACT</a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- ==================== -->
    <!-- MAIN -->
    <!-- ==================== -->

    <main class="illustration-page">
      <!-- PAGE TITLE -->

      <section class="page-title">
        <h1>Works</h1>

        <p>制作したイラスト作品を掲載しています</p>
        <p>※イラストは随時更新していきます</p>
      </section>

      <!-- ==================== -->
      <!-- FILTER -->
      <!-- ==================== -->

      <section class="illustration-filter">
        <button class="filter-button active" data-filter="all" type="button">
          ALL
        </button>

        <button class="filter-button" data-filter="2026" type="button">
          2026
        </button>
      </section>

      <!-- ==================== -->
      <!-- ILLUSTRATION LIST -->
      <!-- ==================== -->

      <section class="illustration-list">
        <div class="illustration-grid">
          <!-- WORK 01 -->

          <article class="illustration-item" data-year="2026">
            <img
              src="images/illustration01.jpg"
              alt="イラスト作品1"
              class="lightbox-image"
            />

            <div class="illustration-info">
              <h2>
                <a
                  href="https://x.com/shippomokomo"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  七宝もこも様 ↗
                </a>
              </h2>

              <p>Illustrated/フェイ・モーリ</p>
            </div>
          </article>

          <!-- WORK 02 -->

          <article class="illustration-item" data-year="2026">
            <img
              src="images/illustration02.gif"
              alt="イラスト作品2"
              class="lightbox-image"
            />

            <div class="illustration-info">
              <h2>
                <a
                  href="https://x.com/shippomokomo"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  七宝もこも様 ↗
                </a>
              </h2>

              <p>Illustrated/フェイ・モーリ</p>
            </div>
          </article>
        </div>
      </section>
    </main>

    <!-- ==================== -->
    <!-- FOOTER -->
    <!-- ==================== -->

    <footer class="footer">
      <p>&copy; 2026 Usagi no OneKeri</p>
    </footer>

    <!-- ==================== -->
    <!-- LIGHTBOX -->
    <!-- ==================== -->

    <div class="lightbox" id="lightbox">
      <button
        class="lightbox-close"
        id="lightboxClose"
        type="button"
        aria-label="画像を閉じる"
      >
        ×
      </button>

      <img id="lightboxImage" src="" alt="" />
    </div>

    <!-- ==================== -->
    <!-- JAVASCRIPT -->
    <!-- ==================== -->

    <script>
      // ====================
      // FILTER
      // ====================

      const filterButtons = document.querySelectorAll(".filter-button");

      const illustrationItems = document.querySelectorAll(".illustration-item");

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const filter = button.dataset.filter;

          // ボタンの状態を変更
          filterButtons.forEach((btn) => {
            btn.classList.remove("active");
          });

          button.classList.add("active");

          // イラストを絞り込む
          illustrationItems.forEach((item) => {
            const year = item.dataset.year;

            if (filter === "all" || year === filter) {
              item.style.display = "";
            } else {
              item.style.display = "none";
            }
          });
        });
      });

      // ====================
      // LIGHTBOX
      // ====================

      const images = document.querySelectorAll(".lightbox-image");

      const lightbox = document.getElementById("lightbox");

      const lightboxImage = document.getElementById("lightboxImage");

      const lightboxClose = document.getElementById("lightboxClose");

      images.forEach((image) => {
        image.addEventListener("click", () => {
          lightboxImage.src = image.src;
          lightboxImage.alt = image.alt;

          lightbox.classList.add("active");
        });
      });

      // 閉じるボタン
      lightboxClose.addEventListener("click", () => {
        lightbox.classList.remove("active");
      });

      // 背景クリックで閉じる
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) {
          lightbox.classList.remove("active");
        }
      });
    </script>
  </body>
</html>
